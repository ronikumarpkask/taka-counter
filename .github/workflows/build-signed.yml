name: Build and Auto-Sign Taka Counter APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK Tools
      uses: android-actions/setup-android@v3

    - name: Install Cordova
      run: npm install -g cordova

    - name: Prepare Cordova Android Platform
      run: cordova platform add android || true

    - name: Build Unsigned Release APK
      run: cordova build android --release

    - name: Sign & Move APK
      run: |
        # Keystore জেনারেট করা
        keytool -genkeypair -v -keystore auto-release-key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias taka_counter_key -dname "CN=TakaCounter, OU=App, O=Dev, L=Dhaka, C=BD" -storepass 123456 -keypass 123456
        
        # Cordova output পাথ থেকে ফাইল নেওয়া
        UNSIGNED_APK=$(find platforms/android/ -name "*.apk" | head -n 1)
        echo "Found APK at: $UNSIGNED_APK"
        
        # Build Tools পাথ সেট করা
        BUILD_TOOLS_PATH=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
        
        # ZipAlign ও Sign করা
        $BUILD_TOOLS_PATH/zipalign -v -p 4 "$UNSIGNED_APK" taka-counter-aligned.apk
        $BUILD_TOOLS_PATH/apksigner sign --ks auto-release-key.jks --ks-pass pass:123456 --out taka-counter-signed.apk taka-counter-aligned.apk

    - name: Upload Signed APK File
      uses: actions/upload-artifact@v4
      with:
        name: taka-counter-signed-apk
        path: taka-counter-signed.apk
